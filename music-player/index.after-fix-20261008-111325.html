<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING BOT Music Player</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at top, #243b55 0%, #121827 38%, #05070c 100%);
}

.container {
  width: min(500px, 94%);
  margin: auto;
  padding: 25px 0 40px;
}

.brand {
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 3px;
  opacity: .8;
  margin-bottom: 10px;
}

.title {
  text-align: center;
  font-size: 29px;
  font-weight: 800;
  margin-bottom: 20px;
}

.search {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.search input {
  flex: 1;
  padding: 14px;
  border: 0;
  outline: none;
  border-radius: 14px;
  background: rgba(255,255,255,.12);
  color: white;
  font-size: 15px;
}

.search input::placeholder {
  color: #aaa;
}

.search button {
  border: 0;
  border-radius: 14px;
  padding: 0 18px;
  background: #1ed760;
  color: #071008;
  font-weight: bold;
  cursor: pointer;
}

.player {
  padding: 20px;
  border-radius: 24px;
  background: rgba(255,255,255,.09);
  backdrop-filter: blur(15px);
  box-shadow: 0 15px 40px rgba(0,0,0,.35);
  margin-bottom: 20px;
}

.cover {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 18px;
  background: #151922;
  display: block;
}

.now-title {
  font-size: 21px;
  font-weight: bold;
  margin-top: 18px;
}

.now-artist {
  color: #aaa;
  margin-top: 5px;
}

.controls {
  display: flex;
  justify-content: center;
  margin-top: 18px;
}

.play {
  width: 62px;
  height: 62px;
  border: 0;
  border-radius: 50%;
  background: #1ed760;
  font-size: 25px;
  cursor: pointer;
}

.status {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin-top: 10px;
}

.results-title {
  font-size: 17px;
  font-weight: bold;
  margin: 20px 5px 10px;
}

.song {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 15px;
  background: rgba(255,255,255,.07);
  cursor: pointer;
}

.song:hover {
  background: rgba(255,255,255,.13);
}

.song img {
  width: 58px;
  height: 58px;
  object-fit: cover;
  border-radius: 10px;
  background: #20242d;
}

.song-info {
  min-width: 0;
  flex: 1;
}

.song-name {
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-artist {
  color: #999;
  font-size: 13px;
  margin-top: 4px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="brand">👑 KING BOT</div>

  <div class="title">🎵 Cari Lagu</div>

  <div class="search">
    <input
      id="searchInput"
      type="text"
      placeholder="Cari judul atau penyanyi..."
    >
    <button onclick="searchSongs()">Cari</button>
  </div>

  <div class="player">

    <img
      id="cover"
      class="cover"
      src=""
      alt="Cover Lagu"
    >

    <div id="nowTitle" class="now-title">
      Pilih lagu
    </div>

    <div id="nowArtist" class="now-artist">
      KING BOT Music Player
    </div>

    <div class="controls">
      <button id="playButton" class="play" onclick="togglePlay()">
        ▶
      </button>
    </div>

    <div id="status" class="status">
      Siap memutar preview lagu
    </div>

  </div>

  <div class="results-title">
    Hasil Lagu
  </div>

  <div id="results">
    <div class="empty">
      Cari lagu untuk menampilkan hasil
    </div>
  </div>

  <audio id="audio"></audio>

</div>

<script>
let currentSong = null;

const audio = document.getElementById("audio");
const cover = document.getElementById("cover");
const nowTitle = document.getElementById("nowTitle");
const nowArtist = document.getElementById("nowArtist");
const playButton = document.getElementById("playButton");
const statusText = document.getElementById("status");
const results = document.getElementById("results");
const searchInput = document.getElementById("searchInput");

async function searchSongs() {
  const query = searchInput.value.trim();

  if (!query) {
    return;
  }

  results.innerHTML = `
    <div class="empty">
      🔎 Mencari lagu...
    </div>
  `;

  try {
    const response = await fetch(
      "/api/search?q=" + encodeURIComponent(query)
    );

    const songs = await response.json();

    if (!Array.isArray(songs) || songs.length === 0) {
      results.innerHTML = `
        <div class="empty">
          Lagu tidak ditemukan
        </div>
      `;
      return;
    }

    results.innerHTML = "";

    songs.forEach(song => {
      const item = document.createElement("div");
      item.className = "song";

      item.innerHTML = `
        <img src="${song.artwork}" alt="">
        <div class="song-info">
          <div class="song-name">${escapeHtml(song.title)}</div>
          <div class="song-artist">
            ${escapeHtml(song.artist)} • ${song.duration}
          </div>
        </div>
      `;

      item.onclick = () => selectSong(song);

      results.appendChild(item);
    });

  } catch (error) {
    console.error(error);

    results.innerHTML = `
      <div class="empty">
        ❌ Gagal mencari lagu
      </div>
    `;
  }
}

function selectSong(song) {
  currentSong = song;

  audio.pause();

  audio.src = song.preview;

  cover.src = song.artwork;
  nowTitle.textContent = song.title;
  nowArtist.textContent = song.artist;

  playButton.textContent = "▶";
  statusText.textContent = "Siap diputar";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

async function togglePlay() {
  if (!currentSong) {
    statusText.textContent = "Pilih lagu terlebih dahulu";
    return;
  }

  try {
    if (audio.paused) {
      await audio.play();

      playButton.textContent = "⏸";
      statusText.textContent = "Sedang diputar...";
    } else {
      audio.pause();

      playButton.textContent = "▶";
      statusText.textContent = "Dijeda";
    }
  } catch (error) {
    console.error(error);

    statusText.textContent =
      "Preview tidak dapat diputar di perangkat ini";
  }
}

audio.addEventListener("ended", () => {
  playButton.textContent = "▶";
  statusText.textContent = "Selesai";
});

searchInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    searchSongs();
  }
});

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
